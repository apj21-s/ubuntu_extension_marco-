<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121212"><meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/app.css"><title>Dropline · Pair</title></head>
<body>
<header class="bar"><div class="dev">
  <svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>
  <div><h1 id="title">Pair with laptop</h1><div class="status" id="status"><i></i><span id="state">One-time setup</span></div></div>
</div></header>
<main class="page">
  <div id="form">
    <label class="label" for="name">Phone name</label>
    <input class="field" id="name" maxlength="40" autocomplete="off" spellcheck="false">
    <button class="btn" id="go">Pair</button>
  </div>
  <div id="done" hidden>
    <div class="done-mark"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Paired</h1>
  </div>
  <p id="msg"></p>
</main>
<script src="/pair.js"></script>
</body></html>
