name: features
# Keeps FEATURES.md / features.tsv (who made which feature) up to date on every push,
# also for pushes made without the local pre-commit hook.
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate the feature list
        run: python3 -I tools/features.py
      - name: Commit it if it changed
        run: |
          git diff --quiet -- FEATURES.md features.tsv && git ls-files --error-unmatch FEATURES.md features.tsv >/dev/null 2>&1 && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add FEATURES.md features.tsv
          git commit -m "Update FEATURES.md (who made which feature)"
          git push
